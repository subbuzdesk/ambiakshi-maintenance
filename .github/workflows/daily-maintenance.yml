name: Ambiakshi Daily Maintenance & Keep-Alive

on:
  schedule:
    # Runs daily at 08:17 UTC (4:17 AM EDT / 3:17 AM EST) - off-peak minute prevents GitHub queue delays
    - cron: '17 8 * * *'
  workflow_dispatch:
    # Allows manual 1-click trigger from GitHub Actions tab

jobs:
  daily-maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Google Service Account (if provided)
        if: env.GOOGLE_SERVICE_ACCOUNT_JSON != ''
        run: |
          mkdir -p config
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > config/google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run Daily Maintenance & Keep-Alive
        run: npm run maintenance:daily
        env:
          SUPABASE_TOOLS_URL: ${{ secrets.SUPABASE_TOOLS_URL }}
          SUPABASE_TOOLS_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TOOLS_SERVICE_ROLE_KEY }}
          SUPABASE_TOOLS_ANON_KEY: ${{ secrets.SUPABASE_TOOLS_ANON_KEY }}
          SUPABASE_HOME_URL: ${{ secrets.SUPABASE_HOME_URL }}
          SUPABASE_HOME_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_HOME_SERVICE_ROLE_KEY }}
          SUPABASE_HOME_ANON_KEY: ${{ secrets.SUPABASE_HOME_ANON_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DAILY_INDEXING_QUOTA: 200
          SSL_EXPIRY_WARNING_DAYS: 30
          MONITORED_DOMAINS: "www.ambiakshi.tools,ambiakshi.com,mobile.ambiakshi.com,slm.ambiakshi.com"
          MONITORED_SITEMAPS: "https://www.ambiakshi.tools/sitemap.xml,https://mobile.ambiakshi.com/sitemap.xml,https://ambiakshi.com/sitemap.xml,https://slm.ambiakshi.com/sitemap.xml"

      - name: Upload Daily Run Reports (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-maintenance-reports
          if-no-files-found: ignore
          path: |
            reports/indexing/*.md
            data/indexing_state.json
          retention-days: 14
